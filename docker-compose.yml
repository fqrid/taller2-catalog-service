version: '3.8'

services:
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    ports:
      - "8001:8001"
    networks:
      - coworking-network
    restart: unless-stopped

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    ports:
      - "8002:8002"
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:8001
      - ANALYTICS_SERVICE_URL=http://analytics-service:8003
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://postgres:postgres@postgres-db:5432/orders_db}
    depends_on:
      - catalog-service
      - analytics-service
    networks:
      - coworking-network
    restart: unless-stopped

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    ports:
      - "8003:8003"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://user:pass@cluster0.mongodb.net/analytics_db?retryWrites=true&w=majority}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-analytics_db}
    networks:
      - coworking-network
    restart: unless-stopped

  # Base de datos PostgreSQL local (opcional/fallback en caso de no conectar directamente a AWS RDS)
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    networks:
      - coworking-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  coworking-network:
    name: coworking_coworking-network
    driver: bridge

volumes:
  pgdata:
