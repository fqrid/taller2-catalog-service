version: '3.8'

services:
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    ports:
      - "8001:8001"
    networks:
      - coworking-network
    restart: unless-stopped

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    ports:
      - "8002:8002"
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:8001
    depends_on:
      - catalog-service
    networks:
      - coworking-network
    restart: unless-stopped

networks:
  coworking-network:
    name: coworking_coworking-network
    driver: bridge
